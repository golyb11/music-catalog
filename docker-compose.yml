services:
  db:
    image: postgres:16-alpine
    container_name: music-catalog-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: music
      POSTGRES_PASSWORD: music
      POSTGRES_DB: music
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U music -d music"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    container_name: music-catalog-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://music:music@db:5432/music?schema=public
      SEED_DEMO_DATA: "true"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
